[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostapprove"
version = "0.1.0"
description = "One local approval queue for the Ghost stack: ingests requests from Seatbelt, GhostGuard, GhostDeploy, and Ghost Bridge style producers, records human approve/deny decisions against an exact hash, executes nothing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "agents", "approvals", "audit", "ghostslice"]
dependencies = []

[project.scripts]
ghostapprove = "ghostapprove.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
